[workspace]

[package]
name = "kernel-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel_rust"
crate-type = ["dylib", "rlib"]

[dependencies]
tomii-types = { path = "../../../../tomii-types" }
tomii-macro = { path = "../../../../tomii-macro" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
