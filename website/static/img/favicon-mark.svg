    <path d="M21.5 24.5 L28.5 16" />
  </g>
  <circle cx="3.5" cy="16" r="3.1" fill="#007FFF" />
  <circle cx="10.5" cy="7.5" r="2.6" fill="#007FFF" />
  <circle cx="10.5" cy="24.5" r="2.6" fill="#007FFF" />
  <circle cx="21.5" cy="7.5" r="2.6" fill="#007FFF" />
