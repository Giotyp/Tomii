name: Release

on:
  # Publishing is gated on a GitHub Release being *published* (not merely tagged).
  # Create the release as a draft, review it, then publish to trigger the pipeline.
  # The release is backed by a `vX.Y.Z` tag, so the tag convention is preserved.
  release:
    types: [published]
  # Allows re-running the PyPI publish without re-publishing the Release (e.g.
  # after trimming the wheel matrix) and without re-triggering the crates.io
  # workflow. The version-consistency check is skipped on this path.
  workflow_dispatch: {}

# id-token for PyPI trusted publishing (no stored API key); contents:write to
# upload the built wheels + sdist as assets on the GitHub Release.
permissions:
  id-token: write
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------- #
  # Fail fast if the published release tag (vX.Y.Z) does not match the versions
  # baked into the manifests, before building 30 wheels for a mismatched release.
  # Skipped on workflow_dispatch (no release tag in that context).
  # --------------------------------------------------------------------------- #
  version-check:
    name: Version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag matches manifest versions
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Event is ${{ github.event_name }} (not a release) — skipping tag/version check."
            exit 0
          fi
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "Release tag: $TAG  ->  expected version: $VER"
          extract() { grep -A8 "$1" "$2" | grep -m1 '^version' | sed -E 's/version *= *"([^"]+)".*/\1/'; }
          ws=$(extract '^\[workspace\.package\]' Cargo.toml)
          py=$(grep -m1 '^version' pyproject.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          bridge=$(grep -m1 '^version' tomii/_python_bridge/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "workspace Cargo.toml=$ws  pyproject.toml=$py  bridge Cargo.toml=$bridge"
          fail=0
          [ "$ws" = "$VER" ]     || { echo "::error::workspace version '$ws' != release '$VER'"; fail=1; }
          [ "$py" = "$VER" ]     || { echo "::error::pyproject version '$py' != release '$VER'"; fail=1; }
          [ "$bridge" = "$VER" ] || { echo "::error::bridge crate version '$bridge' != release '$VER'"; fail=1; }
          exit $fail

  # --------------------------------------------------------------------------- #
  # Build one wheel per (platform, Python) combination.
  #
  # Design note — binary bundling:
  #   `tomii-core --features embed-python` is compiled on the native runner so the
  #   binary and the bridge dylib share the same glibc/SDK version.  This avoids
  #   a manylinux-container mismatch: both artefacts are compatible by construction.
  #   The resulting Linux wheels are tagged for the runner's native glibc
  #   (ubuntu-22.04 → glibc 2.35 → manylinux_2_35+).  Broader glibc compatibility
  #   can be added later by building inside a manylinux_2_28 container.
  # --------------------------------------------------------------------------- #
  wheels:
    name: Wheel (${{ matrix.python }}, ${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each wheel is built natively on its runner (no cross-compilation) so the
      # bundled tomii-core binary and the bridge dylib always match the platform:
      #  - ubuntu-22.04       → linux x86_64
      #  - ubuntu-22.04-arm   → linux aarch64
      #  - macos-15-intel     → macOS x86_64
      #  - macos-14           → macOS arm64 (Apple Silicon)
      # Free-threaded rows ("3.13t"/"3.14t", PEP 703) are first-class: pyo3 0.26
      # supports GIL-disabled interpreters and the bridge declares gil_used=false.
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-14
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        exclude:
          # setup-python has no arm64 CPython 3.9 builds for these runners.
          - os: ubuntu-22.04-arm
            python: "3.9"
          - os: macos-14
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # Free-threaded builds are opt-in for 3.13t
          allow-prereleases: true

      - name: Install maturin
        run: pip install "maturin>=1.7,<2"

      - name: Build tomii-core binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --features embed-python -p tomii-core --bin main
          cp target/release/main tomii/_bin/main

      - name: Build tomii-core binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --features embed-python -p tomii-core --bin main
          copy target\release\main.exe tomii\_bin\main.exe
        shell: cmd

      # maturin build without a manylinux container so the pre-built binary
      # (copied above) is accessible and glibc versions align.
      - name: Build wheel
        run: maturin build --release --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  # --------------------------------------------------------------------------- #
  # Source distribution
  # --------------------------------------------------------------------------- #
  sdist:
    name: Source distribution
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.7,<2"

      - name: Build sdist
        run: maturin sdist --out dist/

      - name: Smoke-build sdist in a clean environment
        run: |
          python -m venv /tmp/sdist-test-env
          /tmp/sdist-test-env/bin/pip install dist/*.tar.gz --no-build-isolation || true
          echo "sdist smoke build done (failure expected without Rust — verifies sdist unpacks)"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # --------------------------------------------------------------------------- #
  # Publish all artefacts to PyPI via OIDC trusted publishing.
  # Requires a PyPI project with a trusted publisher configured for this repo.
  # --------------------------------------------------------------------------- #
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    needs: [wheels, sdist]
    environment: pypi
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List artefacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Idempotent re-runs: skip files already on PyPI (e.g. wheels published
          # in a prior run) and upload only what's new, instead of 400-failing.
          skip-existing: true

      # Attach the same wheels + sdist to the GitHub Release for provenance and
      # direct download (and so a Zenodo/GitHub integration archives them).
      # Skipped on workflow_dispatch, which has no release to attach to.
      - name: Attach wheels + sdist to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
